<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Call Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-dark: #223129;
        --color-box-translucent: rgba(255, 255, 255, 0.05);
        --color-sage-accent: #4C9170;
        --color-mint-soft: #8DC4AA;
        --text-on-dark: #f8fafc;
        --focus-glow: rgba(76, 145, 112, 0.2);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: 'Manrope', system-ui, sans-serif;
        background: var(--color-bg-dark); color: var(--text-on-dark);
        display: flex; justify-content: center; padding: 48px 20px;
    }
    h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; margin: 0 0 8px; }
    p.subtitle { margin: 0 0 28px; font-size: 13px; color: var(--color-mint-soft); }
    #page { width: 100%; max-width: 480px; }
    .form-section {
        background: var(--color-box-translucent); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; padding: 24px;
    }
    .grid-2 { display: flex; gap: 15px; margin-bottom: 18px; }
    .form-group { flex: 1; }
    label {
        display: block; font-weight: 600; margin-bottom: 8px; font-size: 11px;
        text-transform: uppercase; color: var(--color-mint-soft); letter-spacing: 0.5px;
    }
    input[type="date"] {
        width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
        border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.15); color: #fff;
    }
    button {
        width: 100%; background: var(--color-sage-accent); color: #fff; border: none; padding: 16px;
        font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer;
        text-transform: uppercase; letter-spacing: 1px;
    }
    button:hover { background: #3d7a5c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; color: var(--color-mint-soft); }
    #status.error { color: #ef4444; }
</style>
</head>
<body>

<div id="page">
    <h1>Export Call Data</h1>
    <p class="subtitle">Pulls every submission and downloads it as a CSV. Leave dates blank to export everything.</p>

    <div class="form-section">
        <div class="grid-2">
            <div class="form-group">
                <label for="date-from">From</label>
                <input type="date" id="date-from">
            </div>
            <div class="form-group">
                <label for="date-to">To</label>
                <input type="date" id="date-to">
            </div>
        </div>
        <button type="button" id="export-btn" onclick="runExport()">Download CSV</button>
        <div id="status"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Same config as index.html - keep both in sync.
    const firebaseConfig = {
  apiKey: "AIzaSyDgIjCM2kFe4VSpniRNHXJTvNJDOo7tjgQ",
  authDomain: "resteasycalltracking.firebaseapp.com",
  projectId: "resteasycalltracking",
  storageBucket: "resteasycalltracking.firebasestorage.app",
  messagingSenderId: "744235430121",
  appId: "1:744235430121:web:aa650ff3b7a3b570844078",
  measurementId: "G-8VGJSMTXP6"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    signInAnonymously(auth).catch((err) => console.error("Auth failed:", err));

    const statusEl = document.getElementById('status');
    const exportBtn = document.getElementById('export-btn');

    // Generic flattener — any field added to the form later (new nested
    // detail, a renamed key, whatever) automatically becomes its own CSV
    // column with zero changes needed here. This is why the export doesn't
    // need "refining" every time the form's branches change.
    function flatten(obj, prefix = '', out = {}) {
        for (const [key, value] of Object.entries(obj || {})) {
            const flatKey = prefix ? `${prefix}.${key}` : key;
            if (value && typeof value === 'object' && !Array.isArray(value) && !value.toDate) {
                flatten(value, flatKey, out);
            } else if (value && value.toDate) {
                // Firestore Timestamp
                out[flatKey] = value.toDate().toISOString();
            } else {
                out[flatKey] = value ?? '';
            }
        }
        return out;
    }

    function toCSV(rows) {
        if (!rows.length) return '';
        const allKeys = new Set();
        rows.forEach((r) => Object.keys(r).forEach((k) => allKeys.add(k)));
        const headers = Array.from(allKeys);
        const escape = (val) => {
            const s = String(val ?? '');
            return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        };
        const lines = [headers.join(',')];
        rows.forEach((r) => {
            lines.push(headers.map((h) => escape(r[h])).join(','));
        });
        return lines.join('\n');
    }

    window.runExport = async function () {
        exportBtn.disabled = true;
        statusEl.textContent = 'Pulling data...';
        statusEl.className = '';

        try {
            const q = query(collection(db, 'submissions'), orderBy('timestamp'));
            const snap = await getDocs(q);

            const fromVal = document.getElementById('date-from').value;
            const toVal = document.getElementById('date-to').value;
            const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
            const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

            const rows = [];
            snap.forEach((docSnap) => {
                const data = docSnap.data();
                const ts = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : null;
                if (fromDate && ts && ts < fromDate) return;
                if (toDate && ts && ts > toDate) return;
                rows.push(flatten({ id: docSnap.id, ...data }));
            });

            if (!rows.length) {
                statusEl.textContent = 'No submissions found in that range.';
                statusEl.className = 'error';
                return;
            }

            const csv = toCSV(rows);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `call-data-export-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            statusEl.textContent = `Downloaded ${rows.length} rows.`;
        } catch (err) {
            console.error(err);
            statusEl.textContent = 'Export failed — check the console and your Firebase config.';
            statusEl.className = 'error';
        } finally {
            exportBtn.disabled = false;
        }
    };
</script>

</body>
</html>
